<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Meine Einsätze · Klarraum</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="./app-shell.css"><link rel="stylesheet" href="./team.css"><link rel="stylesheet" href="./planning.css"><script type="module" src="./employee.js"></script></head><body class="app-shell"><header class="header"><a class="logo" href="./employee.html">✳︎ Meine Einsätze</a><button id="worker-logout" class="button small" hidden>Abmelden</button></header><main class="wrap admin"><p id="worker-notice" class="form-notice" role="status">Verbindung wird geprüft …</p><p id="worker-error" class="form-error" role="alert" hidden></p><section id="worker-login" class="employee-login" hidden><h1>Anmelden.</h1><form id="worker-login-form" class="panel"><label>E-Mail<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="button" type="submit">Anmelden</button></form></section><section id="worker-invite" class="employee-login" hidden><h1>Zugang einrichten.</h1><p>Einladung einmalig einlösen und eigenes Passwort vergeben.</p><form id="invite-form" class="panel"><label>Neues Passwort (14–256 Zeichen)<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><label>Passwort wiederholen<input name="repeat" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><button class="button" type="submit">Zugang aktivieren</button></form></section><section id="worker-dashboard" hidden><div class="section-top dashboard-heading"><div><div class="eyebrow">Heute</div><h1>Hello <span id="worker-name">Meine Einsätze.</span></h1></div><button id="worker-refresh" class="button small">Aktualisieren ↻</button></div><div class="worker-quick"><span id="worker-count"></span><span>Starten, pausieren, abschließen.</span></div><details id="worker-notifications" class="notifications-panel"><summary><span>Benachrichtigungen</span><span id="notification-count" class="notification-count" aria-live="polite"></span></summary><div id="notification-list" class="notification-list"></div><div class="pagination"><button class="button small secondary" id="notifications-prev">← Zurück</button><button class="button small secondary" id="notifications-next">Weiter →</button></div></details><div id="worker-jobs"></div><div class="pagination"><button id="worker-prev" class="button small">← Zurück</button><button id="worker-next" class="button small">Weiter →</button></div><nav class="worker-tabs" aria-label="Mitarbeiter"><a href="#worker-jobs">Einsätze</a><a href="#worker-jobs">Timer</a><a href="#worker-password">Ich</a></nav><details id="worker-password"><summary>Passwort ändern</summary><form id="worker-password-form" class="panel"><label>Aktuelles Passwort<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="256"></label><label>Neues Passwort<input name="newPassword" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><button class="button" type="submit">Passwort ändern</button><p id="password-status" role="status"></p></form></details></section></main></body></html>
