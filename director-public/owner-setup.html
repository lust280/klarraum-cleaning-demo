<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Activate your company · Klarraum</title><link rel="stylesheet" href="./director.css"><script type="module" src="./owner-setup.js"></script></head><body><main><h1>Activate your company</h1><p>Create your owner password. This invitation is private, single-use and valid for 48 hours. The company starts in fictional-data demo mode.</p><p id="error" role="alert" hidden></p><form><label>Password (14–256 characters)<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><label>Repeat password<input name="repeat" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><button>Activate</button></form><p id="success" hidden>Company activated. <a href="./admin.html">Sign in to company administration</a>.</p></main></body></html>
