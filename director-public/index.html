<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Klarraum · Director console</title><link rel="stylesheet" href="/director.css"><script type="module" src="/director.js"></script></head>
<body><header><strong>✳ Klarraum · <span data-i18n="title">Director console</span></strong><label class="language"><select id="language" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="ru">Русский</option></select></label><button id="logout" hidden data-i18n="signOut">Sign out</button></header>
<main><p id="error" role="alert" hidden></p>
<section id="login"><h1 data-i18n="loginTitle">Director sign-in</h1><form id="login-form"><label><span data-i18n="password">Password</span><input name="password" type="password" autocomplete="current-password" required></label><button data-i18n="signIn">Sign in</button></form></section>
<section id="dashboard" hidden><h1 data-i18n="companies">Companies</h1><p data-i18n="intro"></p><div id="totals" class="totals"></div><p class="notice" data-i18n="notice"></p>
<details><summary data-i18n="create">Create company</summary><form id="create-form"><label><span data-i18n="name"></span><input name="name" maxlength="80" required></label><label><span data-i18n="base"></span><input name="base" type="number" min="0" max="100000" step="0.01" value="0" required></label><label><span data-i18n="included"></span><input name="included" type="number" min="0" max="100000" value="0" required></label><label><span data-i18n="seat"></span><input name="seat" type="number" min="0" max="100000" step="0.01" value="0" required></label><button data-i18n="createEmpty">Create empty installation</button></form></details>
<section id="invitation" hidden><h2 data-i18n="invitation"></h2><p data-i18n="inviteHelp"></p><input id="invite-url" readonly aria-label="Owner invitation"><button id="dismiss-invite" data-i18n="closeInvite"></button></section>
<div class="toolbar"><label><span data-i18n="search"></span><input id="search" type="search"></label><button id="refresh" data-i18n="refresh"></button></div><p data-i18n="workerHelp"></p><div id="companies"></div>
<section id="finance"><h2 data-i18n="finance">Costs and pricing</h2><p data-i18n="financeHelp"></p><div class="toolbar"><label><span data-i18n="month"></span><input id="finance-month" type="month" required></label><button id="finance-refresh" data-i18n="refresh"></button></div><div id="finance-totals" class="totals"></div>
<details><summary data-i18n="addEntry"></summary><form id="finance-entry"><label><span data-i18n="entryType"></span><select name="type"><option value="expense" data-i18n="expense"></option><option value="income" data-i18n="income"></option><option value="refund" data-i18n="refund"></option></select></label><label><span data-i18n="date"></span><input name="date" type="date" required></label><label><span data-i18n="amount"></span><input name="amount" type="number" min="0.01" max="1000000" step="0.01" required></label><label><span data-i18n="category"></span><select name="category" id="finance-category"></select></label><label><span data-i18n="companies"></span><select name="companyId" id="finance-company"></select></label><label><span data-i18n="note"></span><input name="note" maxlength="500"></label><button data-i18n="addEntry"></button></form></details>
<div id="finance-entries"></div><h3 data-i18n="snapshots"></h3><p data-i18n="snapshotHelp"></p><button id="finance-snapshot" data-i18n="snapshot"></button><div id="finance-snapshots"></div><div id="finance-print" hidden><h2 data-i18n="openedReport"></h2><p data-i18n="reportHelp"></p><div id="finance-saved-report"></div><button id="finance-print-button" data-i18n="print"></button><button id="finance-json">JSON</button><button id="finance-csv">CSV</button></div>
<h2 data-i18n="forecast"></h2><p data-i18n="forecastHelp"></p><p data-i18n="assumption" class="notice"></p><form id="finance-forecast"></form><div id="finance-forecast-result" role="status"></div></section>
</section></main></body></html>
