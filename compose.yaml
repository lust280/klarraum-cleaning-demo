services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - company_data:/app/data
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:3000/healthz');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  company_data:
