# Production blueprint for the multi-company KlarraumApp platform.
# It is deliberately separate from render-production.yaml, which serves one
# cleaning company. Opening this file does not create or purchase a service.
services:
  - type: web
    name: klarraumapp-platform
    runtime: node
    region: frankfurt
    plan: standard
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --omit=dev
    startCommand: node director.mjs
    healthCheckPath: /healthz
    disk:
      name: klarraumapp-platform-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIRECTOR_ORIGIN
        sync: false
      - key: COMPANY_BASE_DOMAIN
        sync: false
      - key: DIRECTOR_DATA_DIR
        value: /var/data/director
      - key: APP_SECRET
        generateValue: true
      - key: DIRECTOR_PASSWORD
        sync: false
      - key: MAX_COMPANY_PROCESSES
        value: "5"
      - key: PLATFORM_RESEND_API_KEY
        sync: false
      - key: PLATFORM_MAIL_FROM
        sync: false
