# Free server demonstration. Never use its temporary filesystem for real inquiries.
# The paid persistent-disk option is documented separately in render-production.yaml.
services:
  - type: web
    name: klarraum-demo
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --ignore-scripts --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_ONLY
        value: "true"
      - key: ENABLE_INQUIRIES
        value: "false"
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TRUST_PROXY
        value: "0"
