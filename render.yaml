# Free server demonstration. Never use its temporary filesystem for real inquiries.
# The paid persistent-disk option is documented separately in render-production.yaml.
services:
  - type: web
    name: klarraum-demo
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --ignore-scripts --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_ONLY
        value: "true"
      - key: ENABLE_INQUIRIES
        value: "false"
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TRUST_PROXY
        value: "0"
      # Same Google client as the platform service. Required before
      # klarraumapp.com/api/google/signup/status returns enabled:true.
      # Leave GOOGLE_SIGNIN_REDIRECT_URI empty so this host uses
      # https://klarraumapp.com/api/google/signup/callback.
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
